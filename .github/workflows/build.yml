name: build and release

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

# Target matrix mirrors the mobipeg fork's: native and cross Linux, Windows
# via mingw, and macOS on both architectures plus a universal binary.
#
# ctrtool and sentry-native each configure via cmake and need dependencies
# (curl, for sentry) that are only installed for the native (non-cross)
# Linux leg below. Cross-compiled targets set NO_CTRTOOL=1 NO_SENTRY=1 and
# ship the other tools rather than failing the whole build. wbrsar itself
# has no such restriction -- it always delegates to an external vgmtrans
# CLI binary at runtime (see project/src/wbrsar.c), so it builds fine on
# every leg here.
#
# Verification status: the macOS jobs run the same build that is exercised
# locally on every commit. The Linux cross jobs and the Cygwin job have NOT
# been executed -- there is no Docker or Windows host available here to try
# them on. The mingw cross targets that used to be listed were removed after
# actually attempting one: dclib needs POSIX headers mingw does not ship, so
# those jobs could never have passed.

jobs:
  build-linux:
    name: ${{ matrix.target }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x86_64
          - target: linux-x86
            foreign_arch: i386
            cflags: -m32
            cross: "1"
          - target: linux-arm64
            foreign_arch: arm64
            cross_prefix: aarch64-linux-gnu-
            cross: "1"
          - target: linux-armhf
            foreign_arch: armhf
            cross_prefix: arm-linux-gnueabihf-
            cross: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Add foreign dpkg architecture
        if: matrix.foreign_arch != ''
        run: |
          sudo dpkg --add-architecture ${{ matrix.foreign_arch }}
          sudo sed -i 's/^deb /deb [arch=amd64,i386] /' /etc/apt/sources.list
          if [[ "${{ matrix.foreign_arch }}" == "arm64" || "${{ matrix.foreign_arch }}" == "armhf" ]]; then
            cat <<'EOF' | sudo tee /etc/apt/sources.list.d/ports.list
          deb [arch=arm64,armhf] http://ports.ubuntu.com/ubuntu-ports jammy main universe
          deb [arch=arm64,armhf] http://ports.ubuntu.com/ubuntu-ports jammy-updates main universe
          EOF
          fi
          sudo apt-get update

      - name: Install dependencies
        run: |
          sudo apt-get install -y build-essential
          if [[ -n "${{ matrix.foreign_arch }}" ]]; then
            case "${{ matrix.foreign_arch }}" in
              i386)  sudo apt-get install -y gcc-multilib g++-multilib libpng-dev:i386 zlib1g-dev:i386 libncurses-dev:i386 libssl-dev:i386 ;;
              arm64) sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu libpng-dev:arm64 zlib1g-dev:arm64 libncurses-dev:arm64 libssl-dev:arm64 ;;
              armhf) sudo apt-get install -y gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf libpng-dev:armhf zlib1g-dev:armhf libncurses-dev:armhf libssl-dev:armhf ;;
            esac
          else
            sudo apt-get install -y cmake libpng-dev zlib1g-dev libncurses-dev libcurl4-openssl-dev
          fi

      - name: Build
        # The committed src/ui/{ui,tab}-*.{c,h,inc}/ui.def outputs are already
        # correct and don't need regenerating. Pass -o (--assume-old) for
        # each of them so make never considers them stale, no matter what
        # mtimes their prerequisites end up with as the build progresses
        # (several other .inc files get regenerated from templates during
        # the build itself, so a one-time touch before the build isn't
        # enough -- it gets raced). Without this, cross-compiled targets try
        # to rebuild+run gen-ui with the cross compiler, which can't execute
        # on this x86_64 runner ("Exec format error").
        #
        # -o's argument must match the target name make uses internally,
        # which is the bare filename (ui-wbmgt.c, not src/ui/ui-wbmgt.c) --
        # the Makefile finds it via VPATH. A full-path argument silently
        # doesn't match anything and -o becomes a no-op.
        #
        # NO_CTRTOOL rides on the cross flag: arm64/armhf already skip the
        # bundled ctrtool via PRE (see project/Makefile), but the i386 leg
        # cross-compiles via plain -m32 with no cross_prefix/PRE, so it
        # needs the same opt-out spelled out explicitly here.
        #
        # NO_SENTRY also rides on cross: the dependency step above only
        # installs libcurl-dev for the native (non-cross) leg, so sentry-native's
        # cmake configure (which needs CURL) fails on every cross target.
        run: |
          old_ui_flags=()
          for f in project/src/ui/ui-*.c project/src/ui/ui-*.h project/src/ui/ui.def; do
            old_ui_flags+=(-o "$(basename "$f")")
          done
          make -C project \
            "${old_ui_flags[@]}" \
            ${{ matrix.cross_prefix && format('PRE={0}', matrix.cross_prefix) || '' }} \
            ${{ matrix.cross && 'NO_CTRTOOL=1' || '' }} \
            ${{ matrix.cross && 'NO_SENTRY=1' || '' }} \
            ${{ matrix.cflags && format('XFLAGS={0}', matrix.cflags) || '' }} \
            -j$(nproc) all

      - name: Smoke test
        # Only meaningful where the binaries can actually run.
        if: matrix.foreign_arch == ''
        run: |
          cd project
          ./bin/wszst VERSION
          ./bin/wwc24crypt selftest
          ./bin/wimgt VERSION

      - name: Stage binaries
        run: |
          mkdir -p dist/${{ matrix.target }}
          cp project/bin/* dist/${{ matrix.target }}/ 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        with:
          name: nintoolbox-${{ matrix.target }}
          path: dist/${{ matrix.target }}
          if-no-files-found: error

  # Windows is built under Cygwin, which is the environment this codebase
  # actually supports: dclib includes POSIX headers (arpa/inet.h, sys/ioctl.h)
  # that mingw does not provide, and the Makefile has explicit cygwin handling.
  # A mingw cross build was tried and fails immediately on those includes.
  build-windows:
    name: windows-x86_64
    runs-on: windows-latest
    defaults:
      run:
        shell: C:\cygwin\bin\bash.exe --login -o igncr '{0}'
    steps:
      - uses: actions/checkout@v4
      - uses: cygwin/cygwin-install-action@master
        with:
          packages: gcc-core gcc-g++ make libpng-devel zlib-devel libncurses-devel binutils
      - name: Build
        # See the Linux job's Build step for why -o (--assume-old) is used
        # here instead of a pre-touch: templated .inc files get regenerated
        # with fresh mtimes during the build itself, which would otherwise
        # still make the committed ui-*.c/h look stale partway through.
        #
        # NO_CTRTOOL=1: the bundled ctrtool's own makefile detects native
        # Windows (OS=Windows_NT, which Cygwin also sets) and takes its
        # MSVC-oriented WIN32 branch instead of a plain POSIX one, untested
        # under Cygwin's gcc -- skip it here rather than guess.
        #
        # NO_SENTRY=1: the cygwin-install-action package list above installs
        # neither cmake nor libcurl-devel, both of which sentry-native's
        # configure needs; without them `make sentry` fails inside its own
        # build directory (the outer cmake configure step succeeds against
        # whatever's on PATH, but produces a Makefile missing the "sentry"
        # target). Skip it here rather than provision an unverified Cygwin
        # cmake/curl toolchain blind.
        run: |
          cd "${GITHUB_WORKSPACE}/project"
          old_ui_flags=()
          for f in src/ui/ui-*.c src/ui/ui-*.h src/ui/ui.def; do
            old_ui_flags+=(-o "$(basename "$f")")
          done
          make "${old_ui_flags[@]}" NO_CTRTOOL=1 NO_SENTRY=1 -j$(nproc) all
      - name: Smoke test
        run: |
          cd "${GITHUB_WORKSPACE}/project"
          ./bin/wszst VERSION
          ./bin/wwc24crypt selftest
      - name: Stage binaries
        run: |
          cd "${GITHUB_WORKSPACE}"
          mkdir -p dist/windows-x86_64
          cp project/bin/* dist/windows-x86_64/ || true
      - uses: actions/upload-artifact@v4
        with:
          name: nintoolbox-windows-x86_64
          path: dist/windows-x86_64
          if-no-files-found: error

  # Single macos-14 (arm64) runner instead of a macos-14 + macos-13 matrix
  # fused with lipo afterward: macos-13 is an Intel image GitHub has been
  # retiring from the hosted runner pool, so that job could sit queued
  # forever rather than fail outright ("no worker found"). This mirrors the
  # wiimms-iso-tools-plus fork's fix for the same problem.
  #
  # The x86_64 half is still built as a genuinely separate compile (not a
  # single `-arch x86_64 -arch arm64` invocation, unlike iso-tools) because
  # this project links a Homebrew dylib (libpng) rather than vendoring
  # universal static libs -- Homebrew doesn't ship universal bottles, so we
  # install a second, x86_64-only Homebrew under Rosetta at /usr/local
  # alongside the native arm64 one at /opt/homebrew, and build each arch
  # against its own prefix (Makefile's HOMEBREW_PREFIX override -- see
  # project/Makefile and makefiles-local/Makefile.local.mac) before
  # lipo-ing the results together via `make mac2`.
  build-macos-universal:
    name: macos-universal
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install native (arm64) dependencies
        run: brew install cmake libpng ncurses

      - name: Install Rosetta
        run: softwareupdate --install-rosetta --agree-to-license

      # The "second Homebrew under Rosetta" trick used to get an x86_64
      # libpng.a no longer works: Homebrew's installer now refuses outright
      # ("Homebrew on macOS is only supported on Apple Silicon processors!")
      # rather than just warning, even under `arch -x86_64`. Build libpng
      # from source instead, cross-compiled with clang -target, and drop the
      # static lib straight into /usr/local -- setup.sh already prefers
      # $HOMEBREW_PREFIX/lib/libpng.a (static) over -lpng when it exists, so
      # mac-x86_64's HOMEBREW_PREFIX=/usr/local picks it up with no other
      # changes needed.
      - name: Cache x86_64 libpng build
        id: cache-x86-libpng
        uses: actions/cache@v4
        with:
          path: ~/libpng-x86_64-install
          key: x86_64-libpng-1.6.58-macos14-v1

      - name: Build x86_64 libpng from source
        if: steps.cache-x86-libpng.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          curl -fsSL -o libpng.tar.gz https://github.com/pnggroup/libpng/archive/refs/tags/v1.6.58.tar.gz
          tar xzf libpng.tar.gz
          cd libpng-1.6.58
          CC="clang -target x86_64-apple-macos14.0" ./configure \
            --host=x86_64-apple-darwin --disable-shared --enable-static \
            --prefix="$HOME/libpng-x86_64-install"
          make -j"$(sysctl -n hw.ncpu)"
          make install
          ln -sf libpng16.a "$HOME/libpng-x86_64-install/lib/libpng.a"

      - name: Install x86_64 libpng to /usr/local
        run: |
          sudo mkdir -p /usr/local/include /usr/local/lib
          sudo chown -R "$(whoami)" /usr/local/include /usr/local/lib
          cp -R "$HOME/libpng-x86_64-install/include/." /usr/local/include/
          cp -R "$HOME/libpng-x86_64-install/lib/." /usr/local/lib/

      - name: Build universal binaries
        # Homebrew bottles on this runner are built for macOS 14. Building
        # either slice with the legacy 10.12/11 deployment target makes ld
        # reject or warn on every object in static dependencies such as
        # libpng. Match both output slices to the dependency baseline.
        run: >-
          make -C project -j"$(sysctl -n hw.ncpu)"
          MACOS_X86_64_TARGET=14.0 MACOS_ARM64_TARGET=14.0 mac2

      - name: Smoke test
        run: |
          cd project
          file bin/wszst
          ./bin/wszst VERSION
          ./bin/wwc24crypt selftest
          ./bin/wimgt VERSION

      - name: Stage binaries
        run: |
          mkdir -p dist/macos-universal
          cp project/bin/* dist/macos-universal/ 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        with:
          name: nintoolbox-macos-universal
          path: dist/macos-universal
          if-no-files-found: error

  # Bundle nintoolbox.py (nintoolbox.spec's Analysis, but built inline
  # rather than via the .spec so it can pick up --target-architecture
  # universal2, which the .spec's target_arch=None can't request) into a
  # universal .app, using wszst and all companion tools.
  build-gui-macos:
    name: gui-macos-universal
    needs: build-macos-universal
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: nintoolbox-macos-universal
          path: artifact

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '7.0.x'

      # wszst shells out to external passthrough companion tools: wit (disc/DS/WAD),
      # mobipeg (video/audio transcoding), sharpii (Wii WADs), nsz (Switch NSZ/XCZ),
      # makerom (3DS repacking), wud2app (Wii U WUD extraction), 7zz/7z (archives),
      # ndstool (NDS ROMs), hactool (Switch packages), hacbrewpack (Switch NSP),
      # gba-mus-ripper (GBA music/soundfont ripping), and vgmtrans (BRSAR/other
      # sound-bank conversion, external fallback for wbrsar).
      # Bundling them alongside wszst in the application bundle enables all
      # features out of the box without manual external installation. Every
      # one of them is built from its own upstream source here rather than
      # fetched as a prebuilt release asset -- release asset names/paths
      # drift (see wit below, which 404s against its current release) and a
      # source build lets us pick exactly the target macOS/arch we need.
      - name: Fetch and build companion passthrough tools for bundling (best-effort)
        run: |
          mkdir -p extra_tools
          fetch() {
            local repo="$1" asset="$2"
            local url="https://github.com/${repo}/releases/latest/download/${asset}"
            echo "fetching ${url}"
            if curl -fsSL -o "/tmp/${asset}" "$url"; then
              case "$asset" in
                *.7z) 7z x -y -oextra_tools "/tmp/${asset}" >/dev/null ;;
                *.tar.gz|*.tgz) tar -xzf "/tmp/${asset}" -C extra_tools ;;
                *.tar.xz) tar -xf "/tmp/${asset}" -C extra_tools ;;
                *.zip) unzip -q -o "/tmp/${asset}" -d extra_tools ;;
                *) cp "/tmp/${asset}" "extra_tools/${asset}" ;;
              esac
            else
              echo "::warning::no release asset ${asset} found for ${repo} -- skipping"
            fi
          }
          brew install p7zip autoconf automake libtool

          # 1. wit (quatric/wiimms-iso-tools-plus), universal build. Same
          # Makefile family as this project -- see iso-tools/project's own
          # macos-universal CI job, replicated here: a vendored universal
          # libzstd (its only non-Homebrew dependency) plus a single
          # `-arch x86_64 -arch arm64` compile (unlike this repo's wszst,
          # wit doesn't link a Homebrew dylib per-arch, so one pass works).
          if git clone --depth 1 https://github.com/quatric/wiimms-iso-tools-plus.git /tmp/wit-src 2>/dev/null; then
            ( set -e
              ZSTD_VERSION=1.5.6
              cd /tmp/wit-src
              curl -fsSL "https://github.com/facebook/zstd/releases/download/v${ZSTD_VERSION}/zstd-${ZSTD_VERSION}.tar.gz" | tar xz
              cd "zstd-${ZSTD_VERSION}/lib"
              for arch in arm64 x86_64; do
                make clean >/dev/null
                make -j"$(sysctl -n hw.ncpu)" libzstd.a CFLAGS="-arch $arch -O2"
                mkdir -p "../../deps/out-$arch"
                cp libzstd.a "../../deps/out-$arch/"
              done
              cd /tmp/wit-src
              mkdir -p deps/zstd-universal/lib
              lipo -create deps/out-arm64/libzstd.a deps/out-x86_64/libzstd.a -output deps/zstd-universal/lib/libzstd.a
              cp zstd-${ZSTD_VERSION}/lib/*.h deps/zstd-universal/
              ZDIR="/tmp/wit-src/deps/zstd-universal"
              export LDFLAGS="-L${ZDIR}/lib"
              make -C iso-tools/project -j"$(sysctl -n hw.ncpu)" XFLAGS="-arch x86_64 -arch arm64 -I${ZDIR}" all
              # wit's own MAIN_TOOLS is wit/wwt/wdf (plus wtest, wfuse where
              # available) -- bundle all of them, not just wit itself.
              for t in wit wwt wdf wtest wfuse; do
                if [ -f "iso-tools/project/bin/$t" ]; then
                  cp "iso-tools/project/bin/$t" "$GITHUB_WORKSPACE/extra_tools/$t"
                fi
              done
            ) || echo "::warning::wit source build failed -- skipping"
          fi

          # 1b. GameTDB titles.txt, the game-title database wit's own
          # setup/load-titles.sh fetches and caches (see wit --help's
          # "titles" command and iso-tools/project/Makefile's own `make
          # titles`). Baking it into the bundle means wit shows real game
          # titles out of the box instead of raw IDs. Reproduces that
          # script's core `wit titles / -` reformat step directly rather
          # than templating the script itself (which needs @@INSTALL-PATH@@
          # etc. substituted by iso-tools' own Makefile). Placed both next
          # to wit and under share/ since wit's search path checks both its
          # own directory and a sibling share/ directory for title files.
          if [ -x extra_tools/wit ]; then
            mkdir -p extra_tools/share
            if curl -fsSL http://gametdb.com/titles.txt | extra_tools/wit titles / - > extra_tools/share/titles.txt && [ -s extra_tools/share/titles.txt ]; then
              cp extra_tools/share/titles.txt extra_tools/titles.txt
            else
              echo "::warning::titles.txt fetch/reformat failed -- skipping"
              rm -f extra_tools/share/titles.txt
            fi
          fi

          # 2. mobipeg (quatric/mobipeg, an FFmpeg fork with Mobiclip
          # decoding). Its own macOS CI job builds a universal binary
          # against ~8 vendored codec dependencies (vorbis, opus, lame,
          # speex, theora, webp, dav1d, x264) plus sentry -- replicating
          # that whole pipeline inline here would triple this job's runtime
          # and duplicate a build that's already exercised and cached in
          # mobipeg's own repo. Fetch its release build instead; if the
          # asset name has drifted (as with wit above) this step warns and
          # mobipeg is simply left out of the bundle rather than failing
          # the whole job.
          fetch quatric/mobipeg mobipeg-macos-universal.tar.gz
          [ -f extra_tools/ffmpeg ] && mv extra_tools/ffmpeg extra_tools/mobipeg

          # 3. sharpii (TheShadowEevee/Sharpii-NetCore), universal build. A
          # self-contained single-file .NET publish per RID is itself a
          # real Mach-O executable with its managed payload embedded, so
          # lipo-ing the two RID outputs together produces a genuine
          # universal binary (the same technique dotnet's own docs use for
          # macOS "universal" self-contained apps).
          if git clone --depth 1 https://github.com/TheShadowEevee/Sharpii-NetCore.git /tmp/sharpii-src 2>/dev/null; then
            ( set -e
              cd /tmp/sharpii-src
              dotnet publish -c Release -r osx-arm64 --self-contained true -p:PublishSingleFile=true
              dotnet publish -c Release -r osx-x64 --self-contained true -p:PublishSingleFile=true
              lipo -create \
                bin/Release/net7.0/osx-arm64/publish/Sharpii \
                bin/Release/net7.0/osx-x64/publish/Sharpii \
                -output "$GITHUB_WORKSPACE/extra_tools/sharpii"
            ) || echo "::warning::sharpii source build failed -- skipping"
          fi

          # 4. nsz (nicoboss/nsz), a pure-Python Switch NSZ/XCZ tool. Build
          # a standalone binary from its own source with pyinstaller
          # instead of fetching its release CLI binary.
          if git clone --depth 1 https://github.com/nicoboss/nsz.git /tmp/nsz-src 2>/dev/null; then
            ( set -e
              cd /tmp/nsz-src
              python3 -m pip install --quiet -r requirements.txt pyinstaller
              pyinstaller --onefile --name nsz nsz.py
              cp dist/nsz "$GITHUB_WORKSPACE/extra_tools/nsz"
            ) || echo "::warning::nsz source build failed -- skipping"
          fi

          # 5. makerom (3DSGuy/Project_CTR), 3DS CIA/CCI repacking. Same
          # recursive-Makefile framework as the vendored third_party/ctrtool
          # (see below): its own local deps (libmbedtls, libblz, libyaml)
          # must be built first via `make deps`, or the final link fails
          # with "search path ... not found" for each of them.
          #
          # arm64-only, not universal: this framework's deps archive step
          # runs plain `ar`/`ranlib` over the compiled objects, and Apple's
          # ar cannot operate on a fat (multi-arch) object file ("will be
          # fat and ar(1) will not be able to operate on it") -- the
          # resulting .a is not valid Mach-O at all, so a
          # `-arch arm64 -arch x86_64` CC override fails at the final link
          # with "not a mach-o file" for every dep. Single-arch avoids the
          # bug entirely; the previous prebuilt fetch here was x86_64-only
          # anyway, so this isn't a regression.
          if git clone --depth 1 https://github.com/3DSGuy/Project_CTR.git /tmp/project-ctr-src 2>/dev/null; then
            (cd /tmp/project-ctr-src/makerom && \
              make CC="clang -arch arm64" -j"$(sysctl -n hw.ncpu)" deps && \
              make CC="clang -arch arm64" -j"$(sysctl -n hw.ncpu)" && \
              cp bin/makerom "$GITHUB_WORKSPACE/extra_tools/") || \
              echo "::warning::makerom source build failed -- skipping"
          fi

          # 6. wud2app (PAK-VIN/wud2app-macOS), Wii U WUD extraction. Plain
          # C with its own universal-aware Makefile.
          if git clone --depth 1 https://github.com/PAK-VIN/wud2app-macOS.git /tmp/wud2app-src 2>/dev/null; then
            (cd /tmp/wud2app-src && clang -Wall -Wextra -O3 -arch arm64 -arch x86_64 main.c wudparts.c rijndael.c sha1.c -o "$GITHUB_WORKSPACE/extra_tools/wud2app") || \
              echo "::warning::wud2app source build failed -- skipping"
          fi

          # 7. 7zz / 7z (ip7z/7zip). Building 7-Zip's C++/asm core from
          # source is a much larger, separate undertaking (its own
          # multi-platform build system) than the other tools here, and the
          # official prebuilt binary is the standard way virtually every
          # project consumes 7-Zip -- fetch it rather than vendor a build.
          if curl -fsSL -o /tmp/7z.tar.xz https://github.com/ip7z/7zip/releases/download/26.03/7z2603-mac.tar.xz; then
            tar -xf /tmp/7z.tar.xz -C extra_tools/ 7zz 2>/dev/null || true
            [ -f extra_tools/7zz ] && cp extra_tools/7zz extra_tools/7z
          fi

          # 8. ndstool (Nintendo DS ROM tool, universal build)
          if git clone --depth 1 https://github.com/devkitPro/ndstool.git /tmp/ndstool-src; then
            (cd /tmp/ndstool-src && ./autogen.sh && ./configure CFLAGS="-arch arm64 -arch x86_64" CXXFLAGS="-arch arm64 -arch x86_64 -std=gnu++11" LDFLAGS="-arch arm64 -arch x86_64" && make -j"$(sysctl -n hw.ncpu)" && cp ndstool "$GITHUB_WORKSPACE/extra_tools/") || \
              echo "::warning::ndstool source build failed -- skipping"
          else
            echo "::warning::ndstool clone failed -- skipping"
          fi

          # 9. hactool (Nintendo Switch NCA/XCI/PFS0 tool, universal build)
          if git clone --depth 1 https://github.com/SciresM/hactool.git /tmp/hactool-src; then
            (cd /tmp/hactool-src && cp config.mk.template config.mk && make CC="clang -arch arm64 -arch x86_64" -j"$(sysctl -n hw.ncpu)" && cp hactool "$GITHUB_WORKSPACE/extra_tools/") || \
              echo "::warning::hactool source build failed -- skipping"
          else
            echo "::warning::hactool clone failed -- skipping"
          fi

          # 10. hacbrewpack (Nintendo Switch Homebrew NSP pack tool, universal build)
          if git clone --depth 1 https://github.com/pplatoon/hacBrewPack.git /tmp/hacbrewpack-src; then
            (cd /tmp/hacbrewpack-src && cp config.mk.template config.mk && make CC="clang -arch arm64 -arch x86_64" -j"$(sysctl -n hw.ncpu)" && cp hacbrewpack "$GITHUB_WORKSPACE/extra_tools/") || \
              echo "::warning::hacbrewpack source build failed -- skipping"
          else
            echo "::warning::hacbrewpack clone failed -- skipping"
          fi

          # 11. gba-mus-ripper (GBA Sappy/MP2K music/soundfont ripper), universal
          # build. wszst shells out to this as a passthrough for GBA titles the
          # same way it does for wit/mobipeg -- no vendored copy in src/.
          #
          # Its own makefile hardcodes a mingw (Windows) toolchain in the CPPC/
          # CC variables (not CXX/CC, which our override used to target
          # uselessly), and a WHOLE="-s -fwhole-program -static" link flag set
          # that assumes glibc -- macOS has no static libc/crt0.o, so -static
          # fails to link outright. Override CPPC/CC and drop -static. Also
          # patch a genuine upstream C++ conformance bug (sf2.cpp redeclares a
          # default argument already given in sf2.hpp, which every C++11+
          # compiler but the old mingw g++ this was written for rejects).
          if git clone --depth 1 https://github.com/berg8793/gba-mus-ripper.git /tmp/gba-mus-ripper-src; then
            (cd /tmp/gba-mus-ripper-src && \
              sed -i '' 's/SF2::SF2(unsigned int sample_rate = 22050) :/SF2::SF2(unsigned int sample_rate) :/' sf2.cpp && \
              make CPPC="clang++ -arch arm64 -arch x86_64 -std=gnu++11 -Wno-c++11-narrowing" CC="clang -arch arm64 -arch x86_64" WHOLE="-fwhole-program" -j"$(sysctl -n hw.ncpu)" && \
              cp out/gba_mus_ripper "$GITHUB_WORKSPACE/extra_tools/gba-mus-ripper") || \
              echo "::warning::gba-mus-ripper source build failed -- skipping"
          else
            echo "::warning::gba-mus-ripper clone failed -- skipping"
          fi

          # 12. vgmtrans: NOT bundled. wbrsar always delegates BRSAR/BFSAR/
          # BCSAR conversion to an external vgmtrans binary via --with-
          # vgmtrans/PATH lookup (see project/src/wbrsar.c) if one is
          # present, but no batch CLI target actually exists to fetch or
          # build here: magcius/vgmtrans's "siiva" branch (previously used)
          # has no vgmtrans_cli target at all -- it's the plain Qt GUI
          # (find_package(Qt5Widgets REQUIRED) fails outright without Qt
          # installed). The actively-maintained vgmtrans/vgmtrans does have
          # a non-GUI target (ENABLE_SHELL's vgmtrans-shell), but it's an
          # interactive REPL (see src/ui/shell/vgmtrans-shell.cpp's main),
          # not a one-shot "convert this file" tool -- bundling it as
          # "vgmtrans" would make wbrsar's execv(tool, {in_file, out_dir})
          # hang against an interactive prompt instead of just falling back
          # to the raw asset dump it already does when no external tool is
          # found. Revisit if either project ships a real batch CLI.

          chmod +x extra_tools/* 2>/dev/null || true
          ls -la extra_tools

      - name: Build GUI app (universal2)
        run: |
          chmod +x artifact/* 2>/dev/null || true
          chmod +x extra_tools/* 2>/dev/null || true
          python3 -m pip install --quiet pyinstaller sentry-sdk nsz
          BINARY_ARGS=()
          for f in artifact/* extra_tools/*; do
            [ -f "$f" ] && [ -x "$f" ] && BINARY_ARGS+=(--add-binary "$f:.")
          done
          DATA_ARGS=(--add-data logo.png:.)
          [ -d extra_tools/share ] && DATA_ARGS+=(--add-data extra_tools/share:share)
          pyinstaller --name nintoolbox --windowed \
            "${BINARY_ARGS[@]}" "${DATA_ARGS[@]}" --icon=logo.icns \
            --distpath pyinst_dist \
            --target-architecture universal2 nintoolbox.py
          file pyinst_dist/nintoolbox.app/Contents/MacOS/nintoolbox
          mkdir -p dist/gui-macos-universal
          # Alongside the .app (which has its own in-app "Install CLI Tools
          # to PATH..." button), also ship a standalone cli/ folder with the
          # loose binaries + installer/install.sh for anyone who just wants
          # the command-line tools without the GUI -- same shape as
          # upstream wit/wszst release tarballs.
          mkdir -p pyinst_dist/cli
          for f in artifact/* extra_tools/*; do
            [ -f "$f" ] && [ -x "$f" ] && cp -p "$f" pyinst_dist/cli/
          done
          [ -d extra_tools/share ] && cp -R extra_tools/share pyinst_dist/cli/share
          cp installer/install.sh pyinst_dist/cli/install.sh
          chmod +x pyinst_dist/cli/install.sh
          cd pyinst_dist && zip -r -q ../dist/gui-macos-universal/nintoolbox-macos-universal.zip nintoolbox.app cli

      - uses: actions/upload-artifact@v4
        with:
          name: nintoolbox-gui-macos-universal
          path: dist/gui-macos-universal
          if-no-files-found: error

  # Windows and Linux GUI packages: this project's own tools (wszst and
  # everything else in project/bin/*, already staged wholesale by the
  # build-windows/build-linux jobs) plus the setup scripts, plus best-effort
  # native builds of the same companion passthrough tools gui-macos-universal
  # bundles from source (wit, mobipeg, sharpii, nsz, makerom, wud2app, 7zz,
  # ndstool, hactool, hacbrewpack, gba-mus-ripper), wrapped in nintoolbox.py
  # the same way as gui-macos-universal. Every fetch/build below is
  # best-effort and warns-and-skips on failure rather than failing the job,
  # same as the macOS companion-tools step -- wszst/wbrsar/etc. still work
  # standalone without any of them (see lib-passthru.c's per-tool fallbacks).
  build-gui-windows:
    name: gui-windows-x86_64
    needs: build-windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: nintoolbox-windows-x86_64
          path: artifact

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '7.0.x'

      - uses: cygwin/cygwin-install-action@master
        with:
          packages: gcc-core gcc-g++ make autoconf automake libtool zlib-devel libyaml-devel binutils

      # Companion tools that are plain C/C++ and build fine under Cygwin
      # (same toolchain family build-windows already uses for wszst itself).
      # mbedtls/libblz for makerom are vendored+built by its own Makefile via
      # `make deps`, same as the macOS job.
      - name: Fetch and build companion passthrough tools for bundling (best-effort)
        shell: C:\cygwin\bin\bash.exe --login -o igncr '{0}'
        run: |
          cd "${GITHUB_WORKSPACE}"
          mkdir -p extra_tools

          # 1. wit (quatric/wiimms-iso-tools-plus) -- same Makefile family as
          # this repo, so build it the same way build-windows builds wszst.
          if git clone --depth 1 https://github.com/quatric/wiimms-iso-tools-plus.git /tmp/wit-src 2>/dev/null; then
            (cd /tmp/wit-src/iso-tools/project && make -j"$(nproc)" NO_ZSTD=1 all && \
              for t in wit wwt wdf wtest wfuse; do
                [ -f "bin/$t" ] && cp -p "bin/$t" "$GITHUB_WORKSPACE/extra_tools/$t.exe"
              done) || echo "::warning::wit source build failed -- skipping"
          fi
          if [ -x extra_tools/wit.exe ]; then
            mkdir -p extra_tools/share
            if curl -fsSL http://gametdb.com/titles.txt | extra_tools/wit.exe titles / - > extra_tools/share/titles.txt && [ -s extra_tools/share/titles.txt ]; then
              cp extra_tools/share/titles.txt extra_tools/titles.txt
            else
              echo "::warning::titles.txt fetch/reformat failed -- skipping"
              rm -f extra_tools/share/titles.txt
            fi
          fi

          # 2. mobipeg (quatric/mobipeg) -- fetch its Windows release build.
          if curl -fsSL -o /tmp/mobipeg-win.zip https://github.com/quatric/mobipeg/releases/latest/download/mobipeg-windows-x86_64.zip; then
            unzip -q -o /tmp/mobipeg-win.zip -d extra_tools && \
              [ -f extra_tools/ffmpeg.exe ] && mv extra_tools/ffmpeg.exe extra_tools/mobipeg.exe
          else
            echo "::warning::no mobipeg Windows release asset found -- skipping"
          fi

          # 5. makerom (3DSGuy/Project_CTR)
          if git clone --depth 1 https://github.com/3DSGuy/Project_CTR.git /tmp/project-ctr-src 2>/dev/null; then
            (cd /tmp/project-ctr-src/makerom && make -j"$(nproc)" deps && make -j"$(nproc)" && \
              cp bin/makerom.exe "$GITHUB_WORKSPACE/extra_tools/" 2>/dev/null || cp bin/makerom "$GITHUB_WORKSPACE/extra_tools/makerom.exe") || \
              echo "::warning::makerom source build failed -- skipping"
          fi

          # 6. wud2app (PAK-VIN/wud2app-macOS) -- plain C, portable despite the name
          if git clone --depth 1 https://github.com/PAK-VIN/wud2app-macOS.git /tmp/wud2app-src 2>/dev/null; then
            (cd /tmp/wud2app-src && gcc -Wall -Wextra -O3 main.c wudparts.c rijndael.c sha1.c -o "$GITHUB_WORKSPACE/extra_tools/wud2app.exe") || \
              echo "::warning::wud2app source build failed -- skipping"
          fi

          # 7. 7zz / 7z (ip7z/7zip) -- official Windows release binary
          if curl -fsSL -o /tmp/7z.zip https://github.com/ip7z/7zip/releases/download/26.03/7z2603-x64.zip; then
            unzip -q -o /tmp/7z.zip -d /tmp/7z-extracted 7z.exe 7za.exe 2>/dev/null || true
            [ -f /tmp/7z-extracted/7z.exe ] && cp /tmp/7z-extracted/7z.exe extra_tools/7zz.exe
            [ -f /tmp/7z-extracted/7za.exe ] && cp /tmp/7z-extracted/7za.exe extra_tools/7z.exe
          fi

          # 8. ndstool (devkitPro/ndstool)
          if git clone --depth 1 https://github.com/devkitPro/ndstool.git /tmp/ndstool-src; then
            (cd /tmp/ndstool-src && ./autogen.sh && ./configure && make -j"$(nproc)" && \
              cp ndstool.exe "$GITHUB_WORKSPACE/extra_tools/" 2>/dev/null || cp ndstool "$GITHUB_WORKSPACE/extra_tools/ndstool.exe") || \
              echo "::warning::ndstool source build failed -- skipping"
          fi

          # 9. hactool (SciresM/hactool)
          if git clone --depth 1 https://github.com/SciresM/hactool.git /tmp/hactool-src; then
            (cd /tmp/hactool-src && cp config.mk.template config.mk && make -j"$(nproc)" && \
              cp hactool.exe "$GITHUB_WORKSPACE/extra_tools/" 2>/dev/null || cp hactool "$GITHUB_WORKSPACE/extra_tools/hactool.exe") || \
              echo "::warning::hactool source build failed -- skipping"
          fi

          # 10. hacbrewpack (pplatoon/hacBrewPack)
          if git clone --depth 1 https://github.com/pplatoon/hacBrewPack.git /tmp/hacbrewpack-src; then
            (cd /tmp/hacbrewpack-src && cp config.mk.template config.mk && make -j"$(nproc)" && \
              cp hacbrewpack.exe "$GITHUB_WORKSPACE/extra_tools/" 2>/dev/null || cp hacbrewpack "$GITHUB_WORKSPACE/extra_tools/hacbrewpack.exe") || \
              echo "::warning::hacbrewpack source build failed -- skipping"
          fi

          # 11. gba-mus-ripper -- its own makefile already targets mingw's
          # CPPC/CC, which is exactly Cygwin's toolchain here, so build it
          # unmodified rather than overriding compiler flags as the macOS
          # job has to.
          if git clone --depth 1 https://github.com/berg8793/gba-mus-ripper.git /tmp/gba-mus-ripper-src; then
            (cd /tmp/gba-mus-ripper-src && make -j"$(nproc)" && \
              cp out/gba_mus_ripper.exe "$GITHUB_WORKSPACE/extra_tools/" 2>/dev/null || cp out/gba_mus_ripper "$GITHUB_WORKSPACE/extra_tools/gba-mus-ripper.exe") || \
              echo "::warning::gba-mus-ripper source build failed -- skipping"
          fi

          chmod +x extra_tools/* 2>/dev/null || true
          ls -la extra_tools

      # sharpii (TheShadowEevee/Sharpii-NetCore) -- self-contained single-file
      # publish, native Windows dotnet rather than Cygwin (dotnet isn't a
      # Cygwin package).
      - name: Build sharpii
        shell: bash
        run: |
          if git clone --depth 1 https://github.com/TheShadowEevee/Sharpii-NetCore.git /tmp/sharpii-src 2>/dev/null; then
            (cd /tmp/sharpii-src && \
              dotnet publish -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true && \
              cp bin/Release/net7.0/win-x64/publish/Sharpii.exe "$GITHUB_WORKSPACE/extra_tools/sharpii.exe") || \
              echo "::warning::sharpii source build failed -- skipping"
          fi

      # nsz (nicoboss/nsz) -- pure-Python, standalone pyinstaller build.
      - name: Build nsz
        shell: bash
        run: |
          if git clone --depth 1 https://github.com/nicoboss/nsz.git /tmp/nsz-src 2>/dev/null; then
            (cd /tmp/nsz-src && \
              python3 -m pip install --quiet -r requirements.txt pyinstaller && \
              pyinstaller --onefile --name nsz nsz.py && \
              cp dist/nsz.exe "$GITHUB_WORKSPACE/extra_tools/nsz.exe") || \
              echo "::warning::nsz source build failed -- skipping"
          fi

      - name: Build GUI app
        shell: bash
        run: |
          mkdir -p extra_tools
          chmod +x extra_tools/* 2>/dev/null || true
          python3 -m pip install --quiet pyinstaller sentry-sdk nsz
          BINARY_ARGS=()
          for f in artifact/* extra_tools/*; do
            [ -f "$f" ] && BINARY_ARGS+=(--add-binary "$f:.")
          done
          DATA_ARGS=(--add-data logo.png:.)
          [ -d extra_tools/share ] && DATA_ARGS+=(--add-data extra_tools/share:share)
          pyinstaller --name nintoolbox --windowed \
            "${BINARY_ARGS[@]}" "${DATA_ARGS[@]}" \
            --distpath pyinst_dist nintoolbox.py
          mkdir -p dist/gui-windows-x86_64
          # Standalone cli/ folder (loose .exes + installer/install.ps1) for
          # anyone who just wants the command-line tools -- the GUI itself
          # also has an in-app "Install CLI Tools to PATH..." button.
          mkdir -p pyinst_dist/cli
          for f in artifact/* extra_tools/*; do
            [ -f "$f" ] && cp -p "$f" pyinst_dist/cli/
          done
          [ -d extra_tools/share ] && cp -R extra_tools/share pyinst_dist/cli/share
          cp installer/install.ps1 pyinst_dist/cli/install.ps1
          cd pyinst_dist && 7z a -r -bd ../dist/gui-windows-x86_64/nintoolbox-windows-x86_64.zip nintoolbox cli >/dev/null 2>&1 || \
            (cd .. && cd dist/gui-windows-x86_64 && powershell -Command "Compress-Archive -Path '../../pyinst_dist/nintoolbox','../../pyinst_dist/cli' -DestinationPath 'nintoolbox-windows-x86_64.zip'")

      - uses: actions/upload-artifact@v4
        with:
          name: nintoolbox-gui-windows-x86_64
          path: dist/gui-windows-x86_64
          if-no-files-found: error

  build-gui-linux:
    name: gui-linux-x86_64
    needs: build-linux
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: nintoolbox-linux-x86_64
          path: artifact

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '7.0.x'

      - name: Install Tk (tkinter's runtime library) and native build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk build-essential autoconf automake libtool zlib1g-dev libyaml-dev libzstd-dev p7zip-full

      # Same companion tools as gui-macos-universal (see that job's comments
      # for per-tool background), built natively for Linux instead of
      # cross-compiled/universal.
      - name: Fetch and build companion passthrough tools for bundling (best-effort)
        run: |
          mkdir -p extra_tools

          # 1. wit (quatric/wiimms-iso-tools-plus)
          if git clone --depth 1 https://github.com/quatric/wiimms-iso-tools-plus.git /tmp/wit-src 2>/dev/null; then
            (cd /tmp/wit-src/iso-tools/project && make -j"$(nproc)" all && \
              for t in wit wwt wdf wtest wfuse; do
                [ -f "bin/$t" ] && cp -p "bin/$t" "$GITHUB_WORKSPACE/extra_tools/$t"
              done) || echo "::warning::wit source build failed -- skipping"
          fi
          if [ -x extra_tools/wit ]; then
            mkdir -p extra_tools/share
            if curl -fsSL http://gametdb.com/titles.txt | extra_tools/wit titles / - > extra_tools/share/titles.txt && [ -s extra_tools/share/titles.txt ]; then
              cp extra_tools/share/titles.txt extra_tools/titles.txt
            else
              echo "::warning::titles.txt fetch/reformat failed -- skipping"
              rm -f extra_tools/share/titles.txt
            fi
          fi

          # 2. mobipeg (quatric/mobipeg) -- fetch its Linux release build
          if curl -fsSL -o /tmp/mobipeg-linux.tar.gz https://github.com/quatric/mobipeg/releases/latest/download/mobipeg-linux-x86_64.tar.gz; then
            tar -xzf /tmp/mobipeg-linux.tar.gz -C extra_tools && \
              [ -f extra_tools/ffmpeg ] && mv extra_tools/ffmpeg extra_tools/mobipeg
          else
            echo "::warning::no mobipeg Linux release asset found -- skipping"
          fi

          # 3. sharpii (TheShadowEevee/Sharpii-NetCore)
          if git clone --depth 1 https://github.com/TheShadowEevee/Sharpii-NetCore.git /tmp/sharpii-src 2>/dev/null; then
            (cd /tmp/sharpii-src && \
              dotnet publish -c Release -r linux-x64 --self-contained true -p:PublishSingleFile=true && \
              cp bin/Release/net7.0/linux-x64/publish/Sharpii "$GITHUB_WORKSPACE/extra_tools/sharpii") || \
              echo "::warning::sharpii source build failed -- skipping"
          fi

          # 4. nsz (nicoboss/nsz)
          if git clone --depth 1 https://github.com/nicoboss/nsz.git /tmp/nsz-src 2>/dev/null; then
            (cd /tmp/nsz-src && \
              python3 -m pip install --quiet -r requirements.txt pyinstaller && \
              pyinstaller --onefile --name nsz nsz.py && \
              cp dist/nsz "$GITHUB_WORKSPACE/extra_tools/nsz") || \
              echo "::warning::nsz source build failed -- skipping"
          fi

          # 5. makerom (3DSGuy/Project_CTR)
          if git clone --depth 1 https://github.com/3DSGuy/Project_CTR.git /tmp/project-ctr-src 2>/dev/null; then
            (cd /tmp/project-ctr-src/makerom && make -j"$(nproc)" deps && make -j"$(nproc)" && \
              cp bin/makerom "$GITHUB_WORKSPACE/extra_tools/") || \
              echo "::warning::makerom source build failed -- skipping"
          fi

          # 6. wud2app (PAK-VIN/wud2app-macOS) -- plain C, portable despite the name
          if git clone --depth 1 https://github.com/PAK-VIN/wud2app-macOS.git /tmp/wud2app-src 2>/dev/null; then
            (cd /tmp/wud2app-src && gcc -Wall -Wextra -O3 main.c wudparts.c rijndael.c sha1.c -o "$GITHUB_WORKSPACE/extra_tools/wud2app") || \
              echo "::warning::wud2app source build failed -- skipping"
          fi

          # 7. 7zz / 7z (ip7z/7zip) -- official Linux release binary
          if curl -fsSL -o /tmp/7z.tar.xz https://github.com/ip7z/7zip/releases/download/26.03/7z2603-linux-x64.tar.xz; then
            tar -xf /tmp/7z.tar.xz -C extra_tools 7zz 2>/dev/null || true
            [ -f extra_tools/7zz ] && cp extra_tools/7zz extra_tools/7z
          fi

          # 8. ndstool (devkitPro/ndstool)
          if git clone --depth 1 https://github.com/devkitPro/ndstool.git /tmp/ndstool-src; then
            (cd /tmp/ndstool-src && ./autogen.sh && ./configure && make -j"$(nproc)" && \
              cp ndstool "$GITHUB_WORKSPACE/extra_tools/") || \
              echo "::warning::ndstool source build failed -- skipping"
          fi

          # 9. hactool (SciresM/hactool)
          if git clone --depth 1 https://github.com/SciresM/hactool.git /tmp/hactool-src; then
            (cd /tmp/hactool-src && cp config.mk.template config.mk && make -j"$(nproc)" && \
              cp hactool "$GITHUB_WORKSPACE/extra_tools/") || \
              echo "::warning::hactool source build failed -- skipping"
          fi

          # 10. hacbrewpack (pplatoon/hacBrewPack)
          if git clone --depth 1 https://github.com/pplatoon/hacBrewPack.git /tmp/hacbrewpack-src; then
            (cd /tmp/hacbrewpack-src && cp config.mk.template config.mk && make -j"$(nproc)" && \
              cp hacbrewpack "$GITHUB_WORKSPACE/extra_tools/") || \
              echo "::warning::hacbrewpack source build failed -- skipping"
          fi

          # 11. gba-mus-ripper -- native g++ build, same C++11 default-arg
          # patch the macOS job needs (a genuine upstream conformance bug,
          # not mingw-specific), but no mingw CPPC/CC/-static overrides.
          if git clone --depth 1 https://github.com/berg8793/gba-mus-ripper.git /tmp/gba-mus-ripper-src; then
            (cd /tmp/gba-mus-ripper-src && \
              sed -i 's/SF2::SF2(unsigned int sample_rate = 22050) :/SF2::SF2(unsigned int sample_rate) :/' sf2.cpp && \
              make CPPC="g++ -std=gnu++11" CC=gcc WHOLE="-s -fwhole-program" -j"$(nproc)" && \
              cp out/gba_mus_ripper "$GITHUB_WORKSPACE/extra_tools/gba-mus-ripper") || \
              echo "::warning::gba-mus-ripper source build failed -- skipping"
          fi

          # 12. vgmtrans: NOT bundled, same reasoning as gui-macos-universal
          # (no batch CLI target exists upstream -- see that job's comment).

          chmod +x extra_tools/* 2>/dev/null || true
          ls -la extra_tools

      - name: Build GUI app
        run: |
          chmod +x artifact/* 2>/dev/null || true
          chmod +x extra_tools/* 2>/dev/null || true
          python3 -m pip install --quiet pyinstaller sentry-sdk nsz
          BINARY_ARGS=()
          for f in artifact/* extra_tools/*; do
            [ -f "$f" ] && [ -x "$f" ] && BINARY_ARGS+=(--add-binary "$f:.")
          done
          DATA_ARGS=(--add-data logo.png:.)
          [ -d extra_tools/share ] && DATA_ARGS+=(--add-data extra_tools/share:share)
          pyinstaller --name nintoolbox \
            "${BINARY_ARGS[@]}" "${DATA_ARGS[@]}" \
            --distpath pyinst_dist nintoolbox.py
          mkdir -p dist/gui-linux-x86_64
          # Standalone cli/ folder (loose binaries + installer/install.sh)
          # for anyone who just wants the command-line tools -- the GUI
          # itself also has an in-app "Install CLI Tools to PATH..." button.
          mkdir -p pyinst_dist/cli
          for f in artifact/* extra_tools/*; do
            [ -f "$f" ] && [ -x "$f" ] && cp -p "$f" pyinst_dist/cli/
          done
          [ -d extra_tools/share ] && cp -R extra_tools/share pyinst_dist/cli/share
          cp installer/install.sh pyinst_dist/cli/install.sh
          chmod +x pyinst_dist/cli/install.sh
          cd pyinst_dist && tar -czf ../dist/gui-linux-x86_64/nintoolbox-linux-x86_64.tar.gz nintoolbox cli

      - uses: actions/upload-artifact@v4
        with:
          name: nintoolbox-gui-linux-x86_64
          path: dist/gui-linux-x86_64
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-linux, build-windows, build-macos-universal, build-gui-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Create source archive
        run: |
          tag="${GITHUB_REF_NAME}"
          git archive --format=tar.gz --prefix="wiimms-szs-tools-nintendo-${tag}/" \
            -o "wiimms-szs-tools-nintendo-${tag}-source.tar.gz" HEAD
      - name: Package each target
        run: |
          cd dist
          for d in */; do
            [ -d "$d" ] || continue
            tar -czf "../${d%/}.tar.gz" -C "$d" .
          done
      - name: Create checksums
        run: |
          cp dist/*/*.zip . 2>/dev/null || true
          sha256sum *.tar.gz *.zip 2>/dev/null > SHA256SUMS.txt || sha256sum *.tar.gz > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            *.tar.gz
            *.zip
            SHA256SUMS.txt
